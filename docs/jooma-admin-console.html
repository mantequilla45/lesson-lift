<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Jooma — Admin Console (build spec)</title>
<style>
/* =========================================================================
   JOOMA ADMIN CONSOLE — BRAND TOKENS
   Dev note: these six values are the only colour decisions in the file.
   Swap them for the exact hex codes from jooma.ai and the whole console
   re-skins. Nothing else hardcodes a colour.
   ========================================================================= */
:root{
  --brand:#1F6B5B;        /* Jooma primary — buttons, active nav, links */
  --brand-600:#185849;    /* primary hover */
  --brand-50:#E8F2EF;     /* primary tint background */
  --ai:#6B4FD8;           /* reserved for resource consumption ONLY */
  --ai-50:#F1EDFD;
  --img:#B4530E;          /* reserved for AI-IMAGE credits ONLY — they cost 33x a resource,
                             so they never share a colour with anything else */
  --img-50:#FBEFE6;
  --warn:#A85F0C;
  --warn-50:#FDF3E5;
  --danger:#B3261E;
  --danger-50:#FBECEB;
  --ok:#1B7A45;
  --ok-50:#E8F4EC;

  --paper:#F4F6F8;
  --surface:#FFFFFF;
  --surface-2:#FAFBFC;
  --ink:#15181D;
  --ink-2:#586170;
  --ink-3:#8A929F;
  --line:#E3E7EC;
  --line-2:#EFF2F5;

  --r:10px; --r-sm:7px; --r-lg:14px;
  --sans:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  --mono:ui-monospace,SFMono-Regular,"SF Mono",Menlo,Consolas,monospace;
  --shadow:0 1px 2px rgba(21,24,29,.04),0 4px 14px rgba(21,24,29,.06);
  --shadow-lg:0 10px 40px rgba(21,24,29,.16);
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{
  font-family:var(--sans);background:var(--paper);color:var(--ink);
  font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased;
}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--brand);text-decoration:none}
:focus-visible{outline:2px solid var(--brand);outline-offset:2px;border-radius:4px}
.num{font-family:var(--mono);font-variant-numeric:tabular-nums;letter-spacing:-.02em}

/* ---------- app frame ---------- */
.app{display:grid;grid-template-columns:236px minmax(0,1fr);min-height:100%}
.side{
  background:var(--surface);border-right:1px solid var(--line);
  position:sticky;top:0;height:100vh;display:flex;flex-direction:column;
}
.brand{display:flex;align-items:center;gap:10px;padding:18px 18px 14px;border-bottom:1px solid var(--line-2)}
.brand-mark{
  width:30px;height:30px;border-radius:9px;background:var(--brand);color:#fff;
  display:grid;place-items:center;font-weight:700;font-size:15px;flex:none;
}
.brand-name{font-weight:650;letter-spacing:-.01em}
.brand-sub{font-size:11px;color:var(--ink-3);letter-spacing:.06em;text-transform:uppercase}
.nav{flex:1;overflow-y:auto;padding:12px 10px 20px}
.nav-group{font-size:10.5px;letter-spacing:.09em;text-transform:uppercase;color:var(--ink-3);
  font-weight:650;padding:14px 8px 6px}
.nav a{
  display:flex;align-items:center;gap:9px;padding:7px 8px;border-radius:var(--r-sm);
  color:var(--ink-2);font-weight:500;font-size:13.5px;margin-bottom:1px;
}
.nav a:hover{background:var(--surface-2);color:var(--ink)}
.nav a.on{background:var(--brand-50);color:var(--brand-600);font-weight:600}
.nav .ico{width:16px;text-align:center;opacity:.85;font-size:14px;flex:none}
.nav .pill{margin-left:auto;background:var(--danger);color:#fff;font-size:10.5px;font-weight:700;
  padding:1px 6px;border-radius:20px;line-height:1.6}
.side-foot{border-top:1px solid var(--line-2);padding:12px 14px;display:flex;align-items:center;gap:9px}
.avatar{width:28px;height:28px;border-radius:50%;background:var(--brand-50);color:var(--brand-600);
  display:grid;place-items:center;font-size:11px;font-weight:700;flex:none}

.main{min-width:0;display:flex;flex-direction:column}
.topbar{
  position:sticky;top:0;z-index:30;background:rgba(255,255,255,.86);backdrop-filter:blur(8px);
  border-bottom:1px solid var(--line);padding:0 24px;height:56px;display:flex;align-items:center;gap:14px;
}
.crumb{font-size:13px;color:var(--ink-3)}
.crumb b{color:var(--ink);font-weight:600}
.omni{
  flex:1;max-width:420px;margin-left:auto;position:relative;
}
.omni input{
  width:100%;padding:7px 10px 7px 30px;border:1px solid var(--line);border-radius:var(--r-sm);
  background:var(--surface-2);font-size:13px;
}
.omni input:focus{background:#fff;border-color:var(--brand);outline:none}
.omni .mag{position:absolute;left:9px;top:50%;transform:translateY(-50%);color:var(--ink-3);font-size:13px}
.env{font-size:11px;font-weight:650;padding:3px 8px;border-radius:5px;background:var(--warn-50);color:var(--warn)}
.page{padding:22px 24px 72px;max-width:1440px;width:100%}
.hamb{display:none;background:none;border:1px solid var(--line);border-radius:6px;padding:5px 9px;cursor:pointer}

/* ---------- typography blocks ---------- */
.h1{font-size:21px;font-weight:650;letter-spacing:-.02em}
.h2{font-size:15px;font-weight:650;letter-spacing:-.01em}
.sub{color:var(--ink-2);font-size:13px;margin-top:3px}
.pagehead{display:flex;align-items:flex-start;gap:16px;margin-bottom:18px;flex-wrap:wrap}
.pagehead .grow{flex:1;min-width:260px}
.sechead{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.sechead .grow{flex:1}

/* ---------- surfaces ---------- */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow)}
.card-h{padding:13px 16px;border-bottom:1px solid var(--line-2);display:flex;align-items:center;gap:10px}
.card-b{padding:16px}
.card-b.tight{padding:0}
.card-f{padding:11px 16px;border-top:1px solid var(--line-2);background:var(--surface-2);
  border-radius:0 0 var(--r) var(--r);display:flex;align-items:center;gap:10px}
.grid{display:grid;gap:14px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.g-side{grid-template-columns:minmax(0,1fr) 320px}
.row{display:flex;align-items:center;gap:10px}
.wrap{flex-wrap:wrap}
.grow{flex:1;min-width:0}
.mt{margin-top:14px}.mt-lg{margin-top:22px}.mb{margin-bottom:14px}

/* ---------- stat ---------- */
.stat{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px 15px;box-shadow:var(--shadow)}
.stat .lab{font-size:11.5px;color:var(--ink-2);font-weight:550;letter-spacing:.01em;
  display:flex;align-items:center;gap:6px}
.stat .val{font-size:25px;font-weight:650;letter-spacing:-.03em;margin:6px 0 3px;font-family:var(--mono);
  font-variant-numeric:tabular-nums}
.stat .foot{font-size:11.5px;color:var(--ink-3)}
.delta{font-weight:650;font-size:11.5px}
.delta.up{color:var(--ok)}.delta.down{color:var(--danger)}

/* ---------- buttons ---------- */
.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:6px;
  padding:7px 13px;border-radius:var(--r-sm);border:1px solid var(--line);
  background:var(--surface);font-size:13px;font-weight:550;cursor:pointer;white-space:nowrap;
  transition:background .12s,border-color .12s;
}
.btn:hover{background:var(--surface-2);border-color:#D3D9E0}
.btn.pri{background:var(--brand);border-color:var(--brand);color:#fff}
.btn.pri:hover{background:var(--brand-600);border-color:var(--brand-600)}
.btn.dang{color:var(--danger);border-color:#EDD3D1}
.btn.dang:hover{background:var(--danger-50)}
.btn.sm{padding:4px 9px;font-size:12px}
.btn.ghost{border-color:transparent;background:transparent}
.btn.ghost:hover{background:var(--surface-2);border-color:var(--line)}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.btn-row{display:flex;gap:8px;flex-wrap:wrap}

/* ---------- tags / badges ---------- */
.tag{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;font-weight:600;
  padding:2px 8px;border-radius:20px;background:var(--line-2);color:var(--ink-2);white-space:nowrap}
.tag.ok{background:var(--ok-50);color:var(--ok)}
.tag.warn{background:var(--warn-50);color:var(--warn)}
.tag.dang{background:var(--danger-50);color:var(--danger)}
.tag.ai{background:var(--ai-50);color:var(--ai)}
.tag.brand{background:var(--brand-50);color:var(--brand-600)}
.tag.img{background:var(--img-50);color:var(--img)}
.tag.img.near{background:var(--warn-50);color:var(--warn)}
.tag.img.over{background:var(--danger-50);color:var(--danger)}
.dot{width:6px;height:6px;border-radius:50%;background:currentColor;flex:none}

/* ---------- resource meter (signature component) ----------
   One visual language for "how much fuel is left" — used in tables,
   drawers, school pools and the top-up flow. Never restyle per-context. */
.meter{display:flex;flex-direction:column;gap:4px;min-width:118px}
.meter-bar{height:6px;border-radius:4px;background:var(--line-2);overflow:hidden;display:flex}
.meter-fill{background:var(--ai);height:100%}
.meter-fill.low{background:var(--warn)}
.meter-fill.out{background:var(--danger)}
.meter-fill.topup{background:var(--brand);opacity:.75}
.meter-txt{font-size:11px;color:var(--ink-2);font-family:var(--mono);font-variant-numeric:tabular-nums}
.meter-txt b{color:var(--ink);font-weight:600}

/* ---------- seat pool (schools) ---------- */
.seats{display:flex;flex-wrap:wrap;gap:4px}
.seat{width:15px;height:15px;border-radius:4px;background:var(--line-2);border:1px solid var(--line)}
.seat.used{background:var(--brand);border-color:var(--brand)}
.seat.invited{background:var(--brand-50);border-color:var(--brand);border-style:dashed}
.seat.dormant{background:var(--warn-50);border-color:var(--warn)}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:11.5px;color:var(--ink-2)}
.legend i{width:10px;height:10px;border-radius:3px;display:inline-block;margin-right:5px;vertical-align:-1px}

/* ---------- tables ---------- */
.tblwrap{overflow-x:auto;border-radius:0 0 var(--r) var(--r)}
table{width:100%;border-collapse:collapse}
th{
  text-align:left;font-size:11px;letter-spacing:.05em;text-transform:uppercase;color:var(--ink-3);
  font-weight:650;padding:9px 14px;border-bottom:1px solid var(--line);background:var(--surface-2);
  white-space:nowrap;position:sticky;top:0;
}
td{padding:11px 14px;border-bottom:1px solid var(--line-2);vertical-align:middle}
tbody tr:last-child td{border-bottom:0}
tbody tr:hover{background:var(--surface-2)}
tbody tr.click{cursor:pointer}
.cell-user{display:flex;align-items:center;gap:9px;min-width:0}
.cell-user .nm{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cell-user .em{font-size:11.5px;color:var(--ink-3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tnum{font-family:var(--mono);font-variant-numeric:tabular-nums;font-size:13px}
.rowact{opacity:0;transition:opacity .1s}
tr:hover .rowact{opacity:1}

/* ---------- filters ---------- */
.filters{display:flex;gap:8px;flex-wrap:wrap;align-items:center;padding:12px 16px;border-bottom:1px solid var(--line-2)}
.field{position:relative}
select.inp,input.inp,textarea.inp{
  border:1px solid var(--line);border-radius:var(--r-sm);padding:6px 10px;background:var(--surface);
  font-size:13px;min-width:0;
}
select.inp{padding-right:26px;appearance:none;
  background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='10' height='10' viewBox='0 0 10 10'><path d='M1 3l4 4 4-4' stroke='%238A929F' stroke-width='1.5' fill='none' stroke-linecap='round'/></svg>");
  background-repeat:no-repeat;background-position:right 9px center}
input.inp:focus,select.inp:focus,textarea.inp:focus{border-color:var(--brand);outline:none;
  box-shadow:0 0 0 3px var(--brand-50)}
.inp.w-full{width:100%}
label.lbl{display:block;font-size:12px;font-weight:600;color:var(--ink-2);margin-bottom:5px}
.help{font-size:11.5px;color:var(--ink-3);margin-top:4px}
.formrow{margin-bottom:14px}
.switch{position:relative;width:36px;height:20px;border-radius:20px;background:var(--line);
  border:none;cursor:pointer;flex:none;transition:background .15s}
.switch::after{content:"";position:absolute;top:2px;left:2px;width:16px;height:16px;border-radius:50%;
  background:#fff;transition:transform .15s;box-shadow:0 1px 2px rgba(0,0,0,.2)}
.switch.on{background:var(--brand)}
.switch.on::after{transform:translateX(16px)}
.togrow{display:flex;align-items:center;gap:12px;padding:11px 0;border-bottom:1px solid var(--line-2)}
.togrow:last-child{border-bottom:0}
.togrow .t{font-weight:550;font-size:13.5px}
.togrow .d{font-size:12px;color:var(--ink-3);margin-top:1px}

/* ---------- tabs ---------- */
.tabs{display:flex;gap:2px;border-bottom:1px solid var(--line);margin-bottom:16px;overflow-x:auto}
.tabs button{background:none;border:none;padding:9px 12px;font-size:13.5px;font-weight:550;color:var(--ink-2);
  cursor:pointer;border-bottom:2px solid transparent;margin-bottom:-1px;white-space:nowrap}
.tabs button:hover{color:var(--ink)}
.tabs button.on{color:var(--brand-600);border-bottom-color:var(--brand)}

/* ---------- drawer ---------- */
.scrim{position:fixed;inset:0;background:rgba(21,24,29,.34);z-index:40;opacity:0;pointer-events:none;
  transition:opacity .18s}
.scrim.on{opacity:1;pointer-events:auto}
.drawer{
  position:fixed;top:0;right:0;height:100vh;width:min(560px,100vw);background:var(--surface);
  z-index:50;box-shadow:var(--shadow-lg);transform:translateX(100%);transition:transform .22s cubic-bezier(.2,.8,.2,1);
  display:flex;flex-direction:column;
}
.drawer.on{transform:none}
.drawer-h{padding:16px 18px;border-bottom:1px solid var(--line);display:flex;align-items:flex-start;gap:12px}
.drawer-b{flex:1;overflow-y:auto;padding:16px 18px}
.drawer-f{padding:12px 18px;border-top:1px solid var(--line);background:var(--surface-2);display:flex;gap:8px;flex-wrap:wrap}
.x{background:none;border:none;font-size:19px;color:var(--ink-3);cursor:pointer;line-height:1;padding:2px 4px}
.x:hover{color:var(--ink)}

/* ---------- modal ---------- */
.modal{position:fixed;z-index:60;top:50%;left:50%;transform:translate(-50%,-46%);width:min(520px,94vw);
  background:var(--surface);border-radius:var(--r-lg);box-shadow:var(--shadow-lg);opacity:0;pointer-events:none;
  transition:opacity .16s,transform .16s}
.modal.on{opacity:1;pointer-events:auto;transform:translate(-50%,-50%)}
.modal-h{padding:16px 18px 0}
.modal-b{padding:14px 18px}
.modal-f{padding:12px 18px;border-top:1px solid var(--line-2);display:flex;gap:8px;justify-content:flex-end}

/* ---------- definition list ---------- */
.dl{display:grid;grid-template-columns:128px minmax(0,1fr);gap:0}
.dl dt{font-size:12.5px;color:var(--ink-2);padding:7px 0;border-bottom:1px solid var(--line-2)}
.dl dd{font-size:13px;padding:7px 0;border-bottom:1px solid var(--line-2);word-break:break-word}
.dl dt:last-of-type,.dl dd:last-of-type{border-bottom:0}

/* ---------- timeline ---------- */
.tl{position:relative;padding-left:18px}
.tl::before{content:"";position:absolute;left:4px;top:5px;bottom:5px;width:1px;background:var(--line)}
.tl-i{position:relative;padding:0 0 15px}
.tl-i::before{content:"";position:absolute;left:-18px;top:5px;width:9px;height:9px;border-radius:50%;
  background:var(--surface);border:2px solid var(--line)}
.tl-i.hi::before{border-color:var(--brand);background:var(--brand)}
.tl-t{font-size:13px;font-weight:550}
.tl-m{font-size:11.5px;color:var(--ink-3);font-family:var(--mono)}

/* ---------- chat / inbox ---------- */
.inbox{display:grid;grid-template-columns:290px minmax(0,1fr) 288px;height:calc(100vh - 56px);
  border-top:1px solid var(--line);background:var(--surface)}
.ib-list{border-right:1px solid var(--line);overflow-y:auto;display:flex;flex-direction:column}
.ib-filter{padding:10px 12px;border-bottom:1px solid var(--line-2);position:sticky;top:0;background:var(--surface);z-index:2}
.thread{padding:11px 13px;border-bottom:1px solid var(--line-2);cursor:pointer;display:flex;gap:10px}
.thread:hover{background:var(--surface-2)}
.thread.on{background:var(--brand-50)}
.thread .t1{display:flex;align-items:center;gap:6px}
.thread .nm{font-weight:600;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.thread .tm{font-size:11px;color:var(--ink-3);margin-left:auto;flex:none;font-family:var(--mono)}
.thread .pv{font-size:12px;color:var(--ink-2);margin-top:2px;display:-webkit-box;-webkit-line-clamp:2;
  -webkit-box-orient:vertical;overflow:hidden}
.ib-conv{display:flex;flex-direction:column;min-width:0}
.ib-head{padding:12px 16px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:10px}
.msgs{flex:1;overflow-y:auto;padding:18px 16px;display:flex;flex-direction:column;gap:12px;background:var(--surface-2)}
.msg{max-width:74%;display:flex;flex-direction:column;gap:4px}
.msg .bub{padding:9px 12px;border-radius:12px;font-size:13.5px;background:var(--surface);
  border:1px solid var(--line);border-bottom-left-radius:3px}
.msg .meta{font-size:10.5px;color:var(--ink-3);font-family:var(--mono)}
.msg.me{align-self:flex-end;align-items:flex-end}
.msg.me .bub{background:var(--brand);color:#fff;border-color:var(--brand);
  border-bottom-left-radius:12px;border-bottom-right-radius:3px}
.msg.note .bub{background:var(--warn-50);border-color:#F0DFC4;color:var(--ink)}
.composer{border-top:1px solid var(--line);padding:11px 14px;background:var(--surface)}
.composer textarea{width:100%;border:1px solid var(--line);border-radius:var(--r-sm);padding:9px 11px;
  resize:vertical;min-height:62px;font-size:13.5px}
.ib-ctx{border-left:1px solid var(--line);overflow-y:auto;padding:14px}
.canned{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:9px}

/* ---------- misc ---------- */
.kbd{font-family:var(--mono);font-size:11px;background:var(--surface-2);border:1px solid var(--line);
  border-bottom-width:2px;border-radius:5px;padding:1px 5px;color:var(--ink-2)}
.note{background:var(--brand-50);border:1px solid #C9E0D9;border-radius:var(--r);padding:12px 14px;font-size:13px}
.note.warn{background:var(--warn-50);border-color:#F0DFC4}
.empty{text-align:center;padding:44px 20px;color:var(--ink-3)}
.empty .h{font-weight:600;color:var(--ink-2);margin-bottom:4px;font-size:14px}
.bar-chart{display:flex;align-items:flex-end;gap:6px;height:120px}
.bar{flex:1;background:var(--brand);border-radius:4px 4px 0 0;min-height:3px;position:relative}
.bar.alt{background:var(--ai)}
.bar-lab{font-size:10.5px;color:var(--ink-3);text-align:center;margin-top:6px;font-family:var(--mono)}
.split{display:flex;height:8px;border-radius:5px;overflow:hidden;background:var(--line-2)}
.hr{height:1px;background:var(--line-2);margin:16px 0}
.stepper{display:flex;gap:0;margin-bottom:22px;overflow-x:auto}
.step{display:flex;align-items:center;gap:8px;padding:0 16px 0 0;flex:none}
.step .n{width:23px;height:23px;border-radius:50%;background:var(--line-2);color:var(--ink-3);
  display:grid;place-items:center;font-size:11.5px;font-weight:700;flex:none}
.step.on .n{background:var(--brand);color:#fff}
.step.done .n{background:var(--ok-50);color:var(--ok)}
.step .s{font-size:12.5px;color:var(--ink-3);font-weight:550;white-space:nowrap}
.step.on .s{color:var(--ink)}
.step::after{content:"";width:22px;height:1px;background:var(--line);margin-left:8px}
.step:last-child::after{display:none}
.checklist{display:flex;flex-direction:column}
.ck{display:flex;align-items:flex-start;gap:10px;padding:10px 0;border-bottom:1px solid var(--line-2)}
.ck:last-child{border-bottom:0}
.ck .bx{width:17px;height:17px;border-radius:5px;border:1.5px solid var(--line);flex:none;margin-top:1px;
  display:grid;place-items:center;font-size:10px;color:#fff;cursor:pointer}
.ck.done .bx{background:var(--ok);border-color:var(--ok)}
.ck.done .t{color:var(--ink-3);text-decoration:line-through}
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%) translateY(12px);z-index:80;
  background:var(--ink);color:#fff;padding:9px 15px;border-radius:8px;font-size:13px;opacity:0;
  pointer-events:none;transition:.18s}
.toast.on{opacity:1;transform:translateX(-50%)}
.mono-id{font-family:var(--mono);font-size:11.5px;color:var(--ink-3)}

@media(max-width:1180px){
  .g4{grid-template-columns:repeat(2,minmax(0,1fr))}
  .g-side{grid-template-columns:minmax(0,1fr)}
  .inbox{grid-template-columns:250px minmax(0,1fr)}

/* -------------------------------------------------------------------------
   MARGIN MATHS — the heart of the console.
   Every figure traces back to the developer's measured cost sheets.
   ------------------------------------------------------------------------- */
function aiCost(t){
  return t.used * COST.text + t.deckWeb * COST.deckWeb + t.aiUsed * COST.deckAI;
}
function revenue(t){
  const p = plan(t.plan);
  if (t.term === 'annual') return p.priceY / 12;
  if (t.term === 'seat')   return p.price;          // per seat per month
  if (t.term === 'free')   return 0;
  return p.price;
}
function costToServe(t){
  const rev = revenue(t);
  if (t.plan === 'free') return aiCost(t);
  const card = t.term === 'seat' ? 0 : (rev * COST.cardPct + COST.cardFixed);
  return aiCost(t) + card + COST.infra + COST.support;
}
function contribution(t){ return revenue(t) - costToServe(t); }
function marginPct(t){ const r = revenue(t); return r ? contribution(t)/r : 0; }

/** Token/resource meter — one visual language for "how much is left". */
function meter(used, allow, topup=0, compact=false){
  const total = allow + topup;
  if (!total) return '<span class="meter-txt">—</span>';
  const pct   = Math.min(100, Math.round(used/total*100));
  const remain= Math.max(0, total-used);
  const state = remain===0 ? 'out' : (remain/total < .15 ? 'low' : '');
  const topPct= topup ? Math.round(topup/total*100) : 0;
  return `<div class="meter">
    <div class="meter-bar">
      <div class="meter-fill ${state}" style="width:${pct}%"></div>
      ${topPct?`<div class="meter-fill topup" style="width:${Math.max(0,Math.min(topPct,100-pct))}%"></div>`:''}
    </div>
    ${compact?'':`<div class="meter-txt"><b>${int(remain)}</b> left of ${int(total)}${topup?` <span style="color:var(--brand)">(+${int(topup)} top-up)</span>`:''}</div>`}
  </div>`;
}

/** AI-image credits. Deliberately a different colour and shape from resources —
    they cost 33x as much and must never be confused with each other. */
function aiChip(used, allow, topup=0){
  const total = allow + topup;
  if (!total) return '<span class="tag" title="Not on this plan">—</span>';
  const over = used > total;
  const near = !over && (total-used)/total < .2;
  return `<span class="tag img ${over?'over':near?'near':''}" title="${int(used)} of ${int(total)} AI-image slideshows used this month">
    <span class="dot"></span>${int(used)} / ${int(total)}${topup?` <span style="opacity:.7">+${int(topup)}</span>`:''}</span>`;
}

function marginChip(t){
  if (t.plan === 'free') return `<span class="tag">costs ${pence(aiCost(t))}</span>`;
  const m = marginPct(t);
  const cls = m < 0 ? 'dang' : m < 0.35 ? 'warn' : 'ok';
  return `<span class="tag ${cls}">${(m*100).toFixed(0)}%</span>`;
}

function statusTag(s){
  const map = {
    active:['ok','Active'], invited:['','Invited'], suspended:['dang','Suspended'],
    past_due:['warn','Past due'], cancelling:['warn','Cancelling'],
    live:['ok','Live'], onboarding:['warn','Onboarding'], pending:['','Not started'],
    open:['warn','Open'], closed:['ok','Closed'], paid:['ok','Paid'], sent:['','Sent'],
    overdue:['dang','Overdue'], failed:['dang','Failed'], draft:['','Draft'],
    monthly:['','Monthly'], annual:['brand','Annual'], seat:['brand','School seat'], free:['','Free']
  };
  const [cls,label] = map[s] || ['', s];
  return `<span class="tag ${cls}"><span class="dot"></span>${label}</span>`;
}

function seatSquares(s){
  const active = s.assigned - s.dormant;
  const free = s.seats - s.assigned - s.invited;
  return '<span class="seat used"></span>'.repeat(Math.max(0,active))
       + '<span class="seat dormant"></span>'.repeat(Math.max(0,s.dormant))
       + '<span class="seat invited"></span>'.repeat(Math.max(0,s.invited))
       + '<span class="seat"></span>'.repeat(Math.max(0,free));
}

function fillReply(k){
  const map = {
    tokens:"You've used this month's resources. I've added 100 to your account so you're not stuck — they'll be there next time you refresh. Your allowance resets on the 1st.",
    images:"You've used your AI-generated slideshow images for this month. Slideshows using our free image library are still unlimited, and honestly they look great — most teachers can't tell the difference on a whiteboard. If you'd rather keep the AI ones, a pack of 10 is £2.99, or Max includes 25 a month.",
    annual:"Before you go — the annual plan is £79 for the year, which works out cheaper than ten monthly payments and covers you right through to next summer. No pause needed over the holidays. Want me to switch you over?",
    card:"Your card was declined by your bank rather than by us, which usually means a security check wasn't completed. Here's a secure link to re-enter your card — it takes about 30 seconds and nothing else changes: [link]",
    invite:"Your invite bounced, which normally means your school's email filter blocked it. I've re-sent it now. If it still doesn't arrive, ask your IT lead to allow jooma.ai — instructions here: [link]",
    bug:"Thanks for flagging this — you're right, and it's a bug on our side rather than anything you've done. It's with the developers now (ref JOOM-241) and I'll come back to you the moment it's fixed."
  };
  const r = $('#reply'); if(r){ r.value = map[k]; r.focus(); }
}
